name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Install ai-rulez
        run: make ai-rulez-install

      - name: Format, vet, dependencies, vulnerabilities
        run: make format-check vet deps vuln
        env:
          GOTELEMETRY: "off"

      - name: Agent rules
        run: make governance-verify

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install go-test-coverage
        run: go install github.com/vladopajic/go-test-coverage/v2@v2.20.1

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Race tests, coverage gate, smoke
        run: make test coverage smoke
        env:
          GOTELEMETRY: "off"

      # make test runs without -v, so its log has no PASS line. This step prints the PASS line of each proof test by name.
      # A name with no test prints no PASS line, so a missing test never reads as a pass.
      - name: Proof tests
        if: always()
        run: |
          status=0
          go test -run '^TestBeforeReview_ASecretScanFailsAPlantedKeyInTheCandidateDiffAndPassesACleanOne$' -count=1 -v ./internal/gate/ || status=1
          go test -run '^TestInstall_APartialThreadSyncStopsTheInstallation$' -count=1 -v ./internal/sandbox/landlock/ || status=1
          exit $status
        env:
          GOTELEMETRY: "off"

  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
