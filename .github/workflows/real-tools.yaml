name: Real tools

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-tools:
    if: vars.REAL_TOOLS_SUITE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Real-tool suite
        run: make test-real-tools
        env:
          GH_TOKEN: ${{ secrets.REAL_TOOLS_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.REAL_TOOLS_CLAUDE_TOKEN }}
